<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หมุนตังค์ แชทจำลอง</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/sim.css">
  <script src="/config.js"></script>
  <style>
    .phone { height: 100%; max-width: 440px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="phone" id="sim"></div>
  <script type="module">
    import { remoteBackend } from '/js/backend.js';
    import { mountSimulator } from '/js/simulator.js';
    import { moodPics } from '/core/mood.js';
    mountSimulator(document.getElementById('sim'), remoteBackend(), {
      logoUrl: '/assets/logo-256.png',
      moods: moodPics('/assets'),
      onUri: (uri) => window.open(uri, '_blank', 'noopener'),
    });
  </script>
</body>
</html>
