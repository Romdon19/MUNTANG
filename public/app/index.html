<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หมุนตังค์</title>
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { remoteBackend } from '/js/backend.js';
    import { mountDashboard } from '/js/dashboard.js';

    const root = document.getElementById('app');
    const backend = remoteBackend();
    const dash = mountDashboard(root, backend, { logoUrl: '/assets/logo-192.jpg' });
    backend
      .authenticate()
      .then(() => dash.refresh())
      .catch((e) => {
        root.innerHTML = '<div class="mt-loading"><img src="/assets/logo-192.jpg" alt=""><p></p></div>';
        root.querySelector('p').textContent = e.message;
      });
    addEventListener('visibilitychange', () => document.visibilityState === 'visible' && dash.refresh());
  </script>
</body>
</html>
