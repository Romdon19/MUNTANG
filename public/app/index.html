<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หมุนตังค์</title>
  <meta name="theme-color" content="#ffc400">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { remoteBackend } from '/js/backend.js';
    import { mountDashboard } from '/js/dashboard.js';

    const root = document.getElementById('app');
    // หน้าที่ขอเปิด เช่น ?view=analysis หรือ ?view=list&edit=<id> (มาจากริชเมนู/ปุ่มแก้ไขในแชท)
    const params = new URLSearchParams(location.search);
    const liffState = new URLSearchParams((params.get('liff.state') || '').replace(/^[^?]*\?/, ''));
    const view = params.get('view') || liffState.get('view');
    const edit = params.get('edit') || liffState.get('edit');
    const backend = remoteBackend();
    const dash = mountDashboard(root, backend, { logoUrl: '/assets/logo-256.png', spinUrl: '/assets/mood-spin.png', view, edit });
    backend
      .authenticate()
      .then(() => dash.refresh())
      .catch((e) => {
        root.innerHTML = '<div class="mt-loading"><img src="/assets/logo-256.png" alt=""><p></p></div>';
        root.querySelector('p').textContent = e.message;
      });
    addEventListener('visibilitychange', () => document.visibilityState === 'visible' && dash.refresh());
  </script>
</body>
</html>
