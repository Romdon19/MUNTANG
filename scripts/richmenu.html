<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@600&display=swap">
<style>
  /* Rich menu 2500x1686: 3x2 ช่อง ช่องละ 833x843 */
  html, body { margin: 0; width: 2500px; height: 1686px; background: #0d0d0d; font-family: 'IBM Plex Sans Thai', sans-serif; }
  .grid { display: grid; grid-template-columns: 834px 833px 833px; grid-template-rows: 843px 843px; }
  .cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    border-right: 3px solid #2c2a24; border-bottom: 3px solid #2c2a24; color: #f5f5f5; overflow: hidden; }
  .cell:nth-child(3n) { border-right: 0; }
  .cell:nth-child(n+4) { border-bottom: 0; }
  .icon { width: 260px; height: 260px; border-radius: 50%; display: grid; place-items: center; font-size: 150px;
    background: radial-gradient(circle at 35% 30%, #2b2410, #141414 70%); box-shadow: 0 0 0 6px #ffc400, 0 0 80px rgba(255,196,0,.25); }
  .label { font-size: 92px; font-weight: 600; letter-spacing: .01em; }
  .hint { font-family: 'Chakra Petch', sans-serif; font-size: 52px; color: #a39e92; margin-top: -30px; }
  .cell.hero { background: #ffc400; color: #141100; }
  .cell.hero .icon { background: #0d0d0d; box-shadow: none; }
  .cell.hero .hint { color: #4a3b00; }
  .orbit { position: absolute; width: 900px; height: 380px; border: 5px solid rgba(255,196,0,.18); border-radius: 50%; transform: rotate(-16deg); top: -120px; right: -380px; }
  .cell.hero .orbit { border-color: rgba(0,0,0,.15); }
</style></head>
<body><div class="grid">
  <div class="cell"><div class="orbit"></div><div class="icon">☀️</div><div class="label">สรุปวันนี้</div><div class="hint">TODAY</div></div>
  <div class="cell hero"><div class="orbit"></div><div class="icon"><img src="../public/assets/logo.png" style="width:260px;height:260px;border-radius:50%"></div><div class="label">แดชบอร์ด</div><div class="hint">DASHBOARD</div></div>
  <div class="cell"><div class="orbit"></div><div class="icon">🗓</div><div class="label">สรุปเดือนนี้</div><div class="hint">MONTH</div></div>
  <div class="cell"><div class="icon">🎯</div><div class="label">งบประมาณ</div><div class="hint">BUDGET</div></div>
  <div class="cell"><div class="icon">🧾</div><div class="label">รายการล่าสุด</div><div class="hint">HISTORY</div></div>
  <div class="cell"><div class="icon">📖</div><div class="label">วิธีใช้</div><div class="hint">HELP</div></div>
</div></body></html>
