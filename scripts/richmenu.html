<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&display=swap">
<style>
  /* Rich menu 2500x1686 แบบป้านวล: ช่องใหญ่ "จด" ซ้าย + ช่องเล็ก 6 ช่องขวา บนพื้นดำ
     ตำแหน่งช่องต้องตรงกับ areas ใน src/richmenu.js */
  html, body { margin: 0; width: 2500px; height: 1686px; font-family: 'Kanit', sans-serif; color: #1f1d1a; background: #1f1d1a; }
  .t { position: absolute; box-sizing: border-box; border-radius: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; overflow: hidden; }
  .s { background: #fff6d6; gap: 34px; }
  .ic { width: 230px; height: 230px; border-radius: 50%; background: #ffc400; display: grid; place-items: center; }
  .ic svg { width: 130px; height: 130px; fill: none; stroke: #1f1d1a; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .s b { font-size: 92px; font-weight: 600; line-height: 1; }
  .rec { background: #fbde0a; align-items: flex-start; justify-content: flex-start; padding: 70px 80px; }
  .rec .big { font-size: 330px; font-weight: 700; line-height: 0.85; }
  .rec .mid { font-size: 120px; font-weight: 600; line-height: 1.1; margin-top: 10px; }
  .rec .sm { font-size: 66px; font-weight: 500; line-height: 1.25; margin-top: 30px; color: #3b3000; }
  .rec img { position: absolute; right: 60px; bottom: 60px; width: 300px; height: 300px; border-radius: 64px; }
  .goal { background: #ffc400; flex-direction: row; justify-content: flex-start; gap: 56px; padding-left: 90px; }
  .goal .ic { background: #1f1d1a; width: 270px; height: 270px; }
  .goal .ic svg { stroke: #ffc400; width: 160px; height: 160px; }
  .goal .gt { display: flex; flex-direction: column; }
  .goal b { font-size: 130px; font-weight: 600; line-height: 1.05; }
  .goal small { font-size: 62px; font-weight: 500; color: #3b3000; }
</style></head>
