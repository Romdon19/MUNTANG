name = "muntang"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# เก็บค่า Variables/Secrets ที่ตั้งในหน้าเว็บ Cloudflare ไว้ ไม่ให้ถูกล้างตอน deploy
keep_vars = true
# เปิดลิงก์สาธารณะ https://muntang.<subdomain>.workers.dev
workers_dev = true
preview_urls = false

# ค่าที่ไม่ใช่รหัสลับ (รหัสลับตั้งเป็น Secret ในหน้าเว็บ Cloudflare)
[vars]
LIFF_ID = "2012218154-yRrXmkTD"
LINE_LOGIN_CHANNEL_ID = "2012218154"
# ใช้สร้างลิงก์ในข้อความที่ส่งตามเวลา (รายงานประจำเดือน)
BASE_URL = "https://muntang.67017078.workers.dev"

[build]
command = "node scripts/copy-core.js"

[assets]
directory = "./public"
binding = "ASSETS"

# ฐานข้อมูลผู้ใช้ — ใส่ database_id ของ D1 ที่สร้างไว้
[[d1_databases]]
binding = "DB"
database_name = "muntang"
database_id = "b307af37-f8d3-42ee-be73-544c11c06572"

# Workers AI: แปลงข้อความเสียงเป็นตัวอักษร (Whisper) — มีโควตาฟรีรายวัน
[ai]
binding = "AI"

# ที่เก็บรูปสลิป/ใบเสร็จเป็นหลักฐาน (Cloudflare R2) — สร้าง bucket ชื่อ muntang-slips แล้วเอา # ออก 3 บรรทัดล่าง
# [[r2_buckets]]
# binding = "SLIPS"
# bucket_name = "muntang-slips"

# งานตามเวลา (เตือนรายวัน + รายการประจำ)
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
